[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "human-typer"
version = "2.0.0"
description = "A compact desktop clipboard typer for macOS and Windows"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials==6.12.0",
  "regex>=2024.11.6,<2027",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
human-typer = "human_typer.app:main"

[tool.setuptools.packages.find]
include = ["human_typer*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
# Russian UI strings intentionally use Cyrillic letters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
